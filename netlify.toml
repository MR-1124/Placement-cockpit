[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://integrate.api.nvidia.com https://api.groq.com https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://openrouter.ai https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://form.typeform.com;"

[[redirects]]
  from = "/api-nvidia/*"
  to = "https://integrate.api.nvidia.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-groq/*"
  to = "https://api.groq.com/openai/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-openai/*"
  to = "https://api.openai.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-anthropic/*"
  to = "https://api.anthropic.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-gemini/*"
  to = "https://generativelanguage.googleapis.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-openrouter/*"
  to = "https://openrouter.ai/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
